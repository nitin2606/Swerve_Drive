indent_with_tabs = 0
input_tab_size = 2
output_tab_size = 2
indent_columns = 2
indent_switch_case = 2
indent_case_brace = 2
indent_namespace = 2
indent_label = 1
newlines = auto
sp_before_comma = remove
sp_after_comma = add
sp_paren_paren = remove
sp_before_ellipsis = remove
sp_after_type = add
align_func_params = true
align_var_def_span = 2
align_var_def_inline = true
align_assign_span = 1
align_assign_thresh = 10
align_enum_equ_span = 1
